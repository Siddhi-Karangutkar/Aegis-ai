<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AEGIS.AI</title>
    <style>
        body {
            width: 250px;
            padding: 15px;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
        }
        h2 { margin: 0 0 10px 0; font-size: 16px; color: #38bdf8; text-align: center; }
        p { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 15px; }
        .status {
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 15px;
            background-color: #3b82f6;
            color: white;
        }
        .status.online { background-color: #22c55e; }
        .status.offline { background-color: #ef4444; }
        
        .instructions {
            font-size: 12px;
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            color: #cbd5e1;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h2>🛡️ AEGIS.AI</h2>
    <p>Cyberthreat Detection</p>
    
    <div id="connection-status" class="status">Checking connection...</div>
    
    <div class="instructions">
        <strong>How to use:</strong><br><br>
        1. Highlight any suspicious text or link on a webpage.<br>
        2. Right-click the highlighted text.<br>
        3. Select <strong>"Scan with AEGIS.AI"</strong>.<br>
        4. Hover over the badge for a detailed threat report.
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
